version: '3.8'

services:
  mcp-rooms:
    container_name: mcp_rooms_marketplace
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-google}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_PATH=/app/data/mcp_rooms.db
    volumes:
      # Persistent SQLite storage on host disk
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/listings"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
